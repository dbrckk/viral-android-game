name: Android Build

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "assets/art/**"
      - "tools/art/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "assets/art/**"
      - "tools/art/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Validate art contracts
        run: |
          python tools/art/validate_manifest.py
          python tools/art/validate_group01.py
          python tools/art/validate_vector_sprites.py
          python tools/art/validate_managers.py
          python tools/art/validate_permanent_upgrades.py
          python tools/art/validate_missions.py
          python tools/art/validate_prestige.py
          python tools/art/validate_runtime_assets.py
          python tools/art/validate_raster_loader_usage.py

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: empire-tycoon-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
