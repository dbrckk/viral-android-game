name: Art Assets Validation

on:
  push:
    paths:
      - "assets/art/**"
      - "docs/art/**"
      - "tools/art/**"
      - ".github/workflows/art-assets.yml"
  pull_request:
    paths:
      - "assets/art/**"
      - "docs/art/**"
      - "tools/art/**"
      - ".github/workflows/art-assets.yml"

permissions:
  contents: read

jobs:
  validate-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/art/validate_manifest.py
      - run: python tools/art/validate_group01.py
      - run: python tools/art/validate_vector_sprites.py
      - run: python tools/art/validate_managers.py
      - run: python tools/art/validate_permanent_upgrades.py
      - run: python tools/art/validate_missions.py
